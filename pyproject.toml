[project]
name = "arstotzka"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "aarnesh", email = "aarflameaarnesh@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "google-generativeai>=0.8.6",
    "groq>=1.7.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
]

[project.scripts]
arstotzka = "arstotzka:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
